name: rust-quality-budget-status
description: >-
  Print the structural soft caps — god files and duplicate dependency
  versions. Informational; never fails.
version: 1.0.0

props:
  cap_loc:
    type: string
    default: "500"
    description: God-file soft cap in LOC.

steps:
  - name: budget status
    shell: CAP_LOC="{{ props.cap_loc }}" bash "{{ component_dir }}/scripts/budget-status.sh"
