name: rust-quality-check
description: Fast type check across all targets. No codegen.
version: 1.0.0

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector passed to cargo.
  feature_args:
    type: string
    default: "--all-features"
    description: Feature selector. Set "" for mutually exclusive features.

steps:
  - name: rust-quality-check
    shell: cargo check --locked --all-targets {{ props.pkg_args }} {{ props.feature_args }}
