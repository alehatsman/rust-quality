name: rust-quality-fmt
description: Check rustfmt formatting across the tree; fails listing offending files.
version: 1.0.0

steps:
  - name: cargo fmt --check
    shell: |
      if ! cargo fmt --all --check; then
        echo "fix with: cargo fmt --all" >&2
        exit 1
      fi
      echo "✓ tree is rustfmt-clean"
