name: rust-quality-lint
description: Run clippy with the shared lint block, warnings denied.
version: 1.0.0

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector passed to cargo.
  feature_args:
    type: string
    default: "--all-features"
    description: Feature selector. Set "" for mutually exclusive features.

steps:
  - name: rust-quality-lint
    shell: cargo clippy --locked --all-targets {{ props.pkg_args }} {{ props.feature_args }} -- -D warnings
