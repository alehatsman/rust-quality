name: rust-quality-clippy-findings
description: >-
  Project clippy's JSON diagnostics into the shared finding schema. Busts the
  clippy cache first, so a warm tree still reports.
version: 1.0.0

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector.
  feature_args:
    type: string
    default: "--all-features"
    description: Feature selector. Set "" for mutually exclusive features.

steps:
  - name: clippy findings
    shell: >-
      PKG_ARGS="{{ props.pkg_args }}" FEATURE_ARGS="{{ props.feature_args }}"
      bash "{{ component_dir }}/scripts/clippy-findings.sh"
