description: >-
  Every finding as JSONL for agents (.gate/findings.jsonl) — clippy diagnostics,
  ai-lint, the comment budget, lint-block drift, cargo-alias drift, soft caps.
  A pure producer: never re-gates, never aborts. Enforcement stays with rq/ci.

props:
  dir:
    type: string
    default: "."
    description: >-
      Directory holding the Cargo.toml to gate, relative to where provision is
      invoked. A repo whose crates are not one workspace passes each in turn;
      making them a workspace is that repo's business, not the gate's.
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector for the clippy pass.
  feature_args:
    type: string
    default: "--all-features"
    description: Feature selector. Set "" for mutually exclusive features.
  cap_loc:
    type: string
    default: "500"
    description: God-file soft cap, in code lines.
  cap_comment_run:
    type: string
    default: "15"
    description: Consecutive non-doc `//` lines before `comment-block`.
  cap_comment_ratio:
    type: string
    default: "40"
    description: Non-doc `//` as a percent of code lines before `comment-ratio`.
  out:
    type: string
    default: ".gate/findings.jsonl"
    description: Destination JSONL artifact (gitignored).

steps:
  # Same reason as rq/ci: the clippy pass runs `cargo clean -p` first, so this
  # is always a cold compile of the workspace. A `use` site cannot set it.
  - name: collect findings
    # `cd` before the assignments -- see rq/ci for why the other order loses
    # them. `out` is relative to `dir` now, which is what a per-crate run
    # wants: each crate writes its own .gate/findings.jsonl.
    shell: >-
      cd "{{ props.dir }}" &&
      PKG_ARGS="{{ props.pkg_args }}" FEATURE_ARGS="{{ props.feature_args }}"
      CAP_LOC="{{ props.cap_loc }}"
      CAP_COMMENT_RUN="{{ props.cap_comment_run }}"
      CAP_COMMENT_RATIO="{{ props.cap_comment_ratio }}"
      bash "{{ component_dir }}/scripts/findings.sh" "{{ props.out }}"
    changed_when: "false"
    timeout: 30m
