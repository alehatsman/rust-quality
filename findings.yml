description: >-
  Every finding as JSONL for agents (.gate/findings.jsonl) — clippy diagnostics,
  ai-lint, lint-block drift, soft caps. A pure producer: never re-gates, never
  aborts. Enforcement stays with rq/ci.

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector for the clippy pass.
  feature_args:
    type: string
    default: "--all-features"
    description: Feature selector. Set "" for mutually exclusive features.
  cap_loc:
    type: string
    default: "500"
    description: God-file soft cap in LOC.
  out:
    type: string
    default: ".gate/findings.jsonl"
    description: Destination JSONL artifact (gitignored).

steps:
  # Same reason as rq/ci: the clippy pass runs `cargo clean -p` first, so this
  # is always a cold compile of the workspace. A `use` site cannot set it.
  - name: collect findings
    shell: >-
      PKG_ARGS="{{ props.pkg_args }}" FEATURE_ARGS="{{ props.feature_args }}"
      CAP_LOC="{{ props.cap_loc }}"
      bash "{{ component_dir }}/scripts/findings.sh" "{{ props.out }}"
    changed_when: "false"
    timeout: 30m
