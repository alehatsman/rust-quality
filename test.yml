name: rust-quality-test
description: >-
  Run the test suite with cargo-nextest, then doctests separately — nextest
  does not run them.
version: 1.0.0

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector passed to cargo.
  feature_args:
    type: string
    default: "--all-features"
    description: Feature selector. Set "" for mutually exclusive features.

steps:
  - name: cargo nextest run
    shell: cargo nextest run --locked {{ props.pkg_args }} {{ props.feature_args }}

  - name: doctests
    shell: cargo test --locked --doc {{ props.pkg_args }} {{ props.feature_args }}
