name: rust-quality
description: >-
  Shared Rust quality gate — canonical lint block, clippy/rustfmt/cargo-deny
  config, cargo aliases, a two-mode gate, and the agent-facing Rust guide.
# Six exports, not twenty. Anything that is a single cargo invocation is a
# cargo alias (see aliases.toml), not a preset: `cargo lint`, `cargo t`,
# `cargo docs`. Presets exist only for multi-step gates with fail-fast
# ordering, and for getting config into a consumer repo.
exports:
  default: ci.yml              # full pre-push gate
  ci: ci.yml
  ci-fast: fast.yml            # pre-commit; no extra tools, no network
  tools: tools.yml             # install + verify the three gate tools
  sync-config: sync-config.yml # configs + cargo aliases into the consumer
  lints-check: lints-check.yml # lint-block drift (cargo cannot include manifests)
  findings: findings.yml       # JSONL for agents -> .gate/findings.jsonl
