description: >-
  Fast pre-commit gate — lockfile drift, fmt, clippy, ai-lint and the comment
  budget on staged files, cargo-alias drift, soft caps. No extra tools, no
  network.

props:
  dir:
    type: string
    default: "."
    description: >-
      Directory holding the Cargo.toml to gate, relative to where provision is
      invoked. A repo whose crates are not one workspace passes each in turn;
      making them a workspace is that repo's business, not the gate's.
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector passed to cargo.
  feature_args:
    type: string
    default: "--all-features"
    description: Feature selector. Set "" for mutually exclusive features.
  cap_loc:
    type: string
    default: "500"
    description: God-file soft cap, in code lines (informational).
  cap_comment_run:
    type: string
    default: "15"
    description: >-
      Consecutive non-doc `//` lines before `comment-block` (informational).
  cap_comment_ratio:
    type: string
    default: "40"
    description: >-
      Non-doc `//` as a percent of code lines before `comment-ratio`
      (informational).

steps:
  - name: fast gate
    # `cd` before the assignments -- see rq/ci for why the other order loses
    # them.
    shell: >-
      cd "{{ props.dir }}" &&
      PKG_ARGS="{{ props.pkg_args }}" FEATURE_ARGS="{{ props.feature_args }}"
      CAP_LOC="{{ props.cap_loc }}"
      CAP_COMMENT_RUN="{{ props.cap_comment_run }}"
      CAP_COMMENT_RATIO="{{ props.cap_comment_ratio }}"
      bash "{{ component_dir }}/scripts/gate.sh" fast
    changed_when: "false"
