name: rust-quality-ci-fast
description: >-
  Fast pre-commit gate — lockfile drift, fmt, clippy, ai-lint on staged files,
  soft caps. No extra tools, no network.
version: 2.0.0

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector passed to cargo.
  feature_args:
    type: string
    default: "--all-features"
    description: Feature selector. Set "" for mutually exclusive features.
  cap_loc:
    type: string
    default: "500"
    description: God-file soft cap in LOC (informational).

steps:
  - name: fast gate
    shell: >-
      PKG_ARGS="{{ props.pkg_args }}" FEATURE_ARGS="{{ props.feature_args }}"
      CAP_LOC="{{ props.cap_loc }}"
      bash "{{ component_dir }}/scripts/gate.sh" fast
