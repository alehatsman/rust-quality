description: >-
  Copy the shared config into the consumer repo — clippy.toml, rustfmt.toml and
  deny.toml, plus .cargo/config.toml when the consumer has none — then print the
  lint block, which cargo gives us no way to copy.

props:
  dir:
    type: string
    default: "."
    description: >-
      Directory holding the Cargo.toml to configure, relative to where
      provision is invoked. A repo whose crates are not one workspace runs
      this once per crate.

# A `file` step's `src` resolves against the file that names it, so
# `{{ component_dir }}` is what reaches this checkout's own copies. `path` is
# not resolved: a relative one is relative to the directory provision was
# invoked from, which is the consumer repo. That asymmetry is the whole
# mechanism -- read from here, write over there -- and it is why neither side
# needs an argument saying where the consumer is.
#
# No `force`: `file` compares bytes and reports `ok` when they already match,
# so re-running this is a no-op that says so. Overwriting unconditionally was
# `file.copy`'s idea of the same thing.
#
# That reasoning holds for the three files this repo owns. It does not hold for
# `.cargo/config.toml`, which the consumer owns — see the `creates` gate below.
steps:
  - name: clippy.toml
    file: { path: "{{ props.dir }}/clippy.toml", state: file, src: "{{ component_dir }}/clippy.toml" }
  - name: rustfmt.toml
    file: { path: "{{ props.dir }}/rustfmt.toml", state: file, src: "{{ component_dir }}/rustfmt.toml" }
  - name: deny.toml
    file: { path: "{{ props.dir }}/deny.toml", state: file, src: "{{ component_dir }}/deny.toml" }
  # `file` writes a file, it does not build the path to it, and a crate that
  # has never had cargo config has no `.cargo/`. At a repo root the directory
  # usually already exists, which is why this only showed up once `dir` pointed
  # the preset at a crate that had never been configured.
  - name: .cargo
    file: { path: "{{ props.dir }}/.cargo", state: dir }
  # `creates`, unlike the three above: the other files are ours and a consumer
  # has no reason to hand-edit them, but `.cargo/config.toml` is where a repo
  # keeps its own `[build] rustflags`, `[target.*] linker`, registry and `[net]`
  # settings. Writing ours over that is not a sync, it is data loss, and the
  # aliases are not worth it. Absent, we install it; present, it is the
  # consumer's file and the next step prints what to add.
  - name: .cargo/config.toml
    file: { path: "{{ props.dir }}/.cargo/config.toml", state: file, src: "{{ component_dir }}/aliases.toml" }
    creates: "{{ props.dir }}/.cargo/config.toml"

  # The mirror of the step above: `unless` exits 0 — "already done", skip —
  # exactly when there is no file of the consumer's to merge into.
  - name: aliases for an existing .cargo/config.toml
    shell: |
      echo "── {{ props.dir }}/.cargo/config.toml already exists and was left alone."
      echo "   Merge these in by hand; rq/ci does not depend on them ──"
      cat "{{ component_dir }}/aliases.toml"
    unless: test ! -f "{{ props.dir }}/.cargo/config.toml"
    changed_when: "false"

  # Cargo has no include mechanism for manifests, so the lint levels are the
  # one thing that cannot be a file copy. Print them; rq/lints-check enforces.
  - name: print the lint block
    shell: |
      echo "── paste into the WORKSPACE ROOT Cargo.toml, then give every member"
      echo "   crate:  [lints]  /  workspace = true   — rq/lints-check enforces both ──"
      cat "{{ component_dir }}/lints.toml"
    changed_when: "false"
