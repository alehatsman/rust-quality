name: rust-quality-sync-config
description: >-
  Copy the shared config into the consumer repo — clippy.toml, rustfmt.toml,
  deny.toml and .cargo/config.toml — then print the lint block, which cargo
  gives us no way to copy.
version: 2.0.0

steps:
  - name: clippy.toml
    file.copy: { src: "{{ component_dir }}/clippy.toml", dest: "clippy.toml", force: true }
  - name: rustfmt.toml
    file.copy: { src: "{{ component_dir }}/rustfmt.toml", dest: "rustfmt.toml", force: true }
  - name: deny.toml
    file.copy: { src: "{{ component_dir }}/deny.toml", dest: "deny.toml", force: true }
  - name: .cargo/config.toml
    file.copy: { src: "{{ component_dir }}/aliases.toml", dest: ".cargo/config.toml", force: true }

  # Cargo has no include mechanism for manifests, so the lint levels are the
  # one thing that cannot be a file copy. Print them; rq/lints-check enforces.
  - name: print the lint block
    shell: |
      echo "── paste into the WORKSPACE ROOT Cargo.toml, then give every member"
      echo "   crate:  [lints]  /  workspace = true   — rq/lints-check enforces both ──"
      cat "{{ component_dir }}/lints.toml"
