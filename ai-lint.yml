name: rust-quality-ai-lint
description: >-
  Sweep Rust source for AI-agent residue — stub macros, agent-tagged TODOs,
  prompt artifacts, diff relics.
version: 1.0.0

props:
  scope:
    type: string
    default: ""
    description: 'Pass "--all" to scan every tracked file instead of staged only.'

steps:
  - name: ai-lint
    shell: bash "{{ component_dir }}/scripts/ai-lint.sh" {{ props.scope }}
