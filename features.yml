name: rust-quality-features
description: >-
  cargo-hack feature powerset check — proves every feature combination still
  compiles, which is the only way to keep features actually additive. Cost is
  exponential in feature count; depth caps it.
version: 1.0.0

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector.
  depth:
    type: string
    default: "2"
    description: Max feature-combination size. Raise deliberately.

steps:
  - name: cargo hack --feature-powerset
    shell: >-
      cargo hack check --feature-powerset --depth {{ props.depth }}
      --no-dev-deps {{ props.pkg_args }}
