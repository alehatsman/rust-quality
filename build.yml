name: rust-quality-build
description: Release build with the lockfile pinned.
version: 1.0.0

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector passed to cargo.
  feature_args:
    type: string
    default: "--all-features"
    description: Feature selector. Set "" for mutually exclusive features.

steps:
  - name: rust-quality-build
    shell: cargo build --locked --release {{ props.pkg_args }} {{ props.feature_args }}
