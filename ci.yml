description: >-
  Full pre-push gate — fmt, clippy, test + doctests, rustdoc, cargo-deny,
  cargo-machete, lint-block drift, soft caps. First failure stops the run.

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector passed to cargo.
  feature_args:
    type: string
    default: "--all-features"
    description: >-
      Feature selector. Crates with mutually exclusive features must set this
      to "" — --all-features cannot compile them.
  cap_loc:
    type: string
    default: "500"
    description: God-file soft cap in LOC (informational).

steps:
  # The full gate compiles the workspace twice over -- clippy's pass and the
  # test profile's -- and runs the whole suite. Ten minutes is the default and
  # a cold machine will exceed it. It lives here rather than at a call site: a
  # `use` step propagates tags to its children and nothing else, so a consumer
  # cannot reach in to set it.
  - name: full gate
    shell: >-
      PKG_ARGS="{{ props.pkg_args }}" FEATURE_ARGS="{{ props.feature_args }}"
      CAP_LOC="{{ props.cap_loc }}"
      bash "{{ component_dir }}/scripts/gate.sh" full
    changed_when: "false"
    timeout: 30m
