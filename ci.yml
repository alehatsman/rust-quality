name: rust-quality-ci
description: >-
  Full pre-push gate — fmt, clippy, test + doctests, rustdoc, cargo-deny,
  cargo-machete, lint-block drift, ai-lint on tracked files, soft caps. First
  failure stops the run.
version: 2.0.0

props:
  pkg_args:
    type: string
    default: "--workspace"
    description: Package selector passed to cargo.
  feature_args:
    type: string
    default: "--all-features"
    description: >-
      Feature selector. Crates with mutually exclusive features must set this
      to "" — --all-features cannot compile them.
  cap_loc:
    type: string
    default: "500"
    description: God-file soft cap in LOC (informational).

steps:
  - name: full gate
    shell: >-
      PKG_ARGS="{{ props.pkg_args }}" FEATURE_ARGS="{{ props.feature_args }}"
      CAP_LOC="{{ props.cap_loc }}"
      bash "{{ component_dir }}/scripts/gate.sh" full
